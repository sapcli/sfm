name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=chocolatey
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_PAT_TOKEN: ${{ secrets.WINGET_PAT_TOKEN }}

  chocolatey:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifact
        run: gh release download ${{ github.ref_name }} --repo sapcli/sfm --pattern "sfm_${{ github.ref_name }}_windows_amd64.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare package files
        run: |
          VERSION=${GITHUB_REF_NAME}
          cat > sfm.nuspec << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>sfm</id>
              <version>__VERSION__</version>
              <title>SFM - SAP For Me CLI</title>
              <authors>sapcli</authors>
              <owners>SAPCLI</owners>
              <projectUrl>https://github.com/sapcli/sfm</projectUrl>
              <projectSourceUrl>https://github.com/sapcli/sfm</projectSourceUrl>
              <docsUrl>https://github.com/sapcli/sfm/blob/main/README.md</docsUrl>
              <bugTrackerUrl>https://github.com/sapcli/sfm/issues</bugTrackerUrl>
              <copyright>SAPCLI</copyright>
              <licenseUrl>https://github.com/sapcli/sfm/blob/main/LICENSE</licenseUrl>
              <tags>sap cli launchpad users partner</tags>
              <summary>CLI for managing SAP For Me (SAP launchpad) users and partner users.</summary>
              <description><![CDATA[
          SAP For Me CLI - Manage SAP launchpad users and partner users.
          Supports user listing, creation, deletion, expiry extension, and search.
          ]]></description>
              <releaseNotes>https://github.com/sapcli/sfm/releases/tag/__VERSION__</releaseNotes>
            </metadata>
            <files>
              <file src="sfm___VERSION___windows_amd64.zip" target="tools\sfm.zip" />
              <file src="chocolateyinstall.ps1" target="tools\chocolateyinstall.ps1" />
            </files>
          </package>
          EOF
          sed -i "s/__VERSION__/${VERSION}/g" sfm.nuspec
          sed -i "s/sfm___VERSION___/sfm_${VERSION}/g" sfm.nuspec

          cat > chocolateyinstall.ps1 << 'PS1'
          $ErrorActionPreference = 'Stop'
          $toolsDir = "$(Split-Path -parent $MyInvocation.MyCommand.Definition)"
          $zip = Join-Path $toolsDir 'sfm.zip'
          $dest = Join-Path $toolsDir 'sfm'
          Get-ChocolateyUnzip -FileFullPath $zip -Destination $dest
          Install-ChocolateyPath -PathToJoin $dest
          PS1

      - name: Build and push to Chocolatey
        uses: docker://chocolatey/choco:latest-linux
        with:
          entrypoint: bash
          args: -c "choco pack /github/workspace/sfm.nuspec && choco push /github/workspace/sfm.${{ github.ref_name }}.nupkg -s https://push.chocolatey.org/ -k ${{ secrets.CHOCOLATEY_API_KEY }}"
