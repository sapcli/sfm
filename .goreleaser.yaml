version: 2
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/sfm
    binary: sfm
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
archives:
  - formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Tag }}-next"
brews:
  - name: sfm
    repository:
      owner: sapcli
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@sapcli.github.io
    homepage: "https://github.com/sapcli/sfm"
    description: "CLI for managing SAP For Me (SAP launchpad) users and partner users."
    license: "MIT"
    install: |
      bin.install "sfm"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
